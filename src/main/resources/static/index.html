<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 일기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sky-bg"></div>

    <header class="header">
        <div class="header-inner">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">☁</span>
                <div>
                    <h1>날씨 일기</h1>
                    <p class="subtitle" id="headerSubtitle">날씨와 함께 기록하는 하루</p>
                </div>
            </div>
            <div class="header-actions" id="headerActions">
                <span class="header-user hidden" id="headerUser"></span>
                <button type="button" class="btn btn-ghost hidden" id="btnProfile">내 정보</button>
                <a href="/signin.html" class="btn btn-ghost" id="btnLogin">로그인</a>
                <a href="/signup.html" class="btn btn-secondary" id="btnSignup">회원가입</a>
                <button type="button" class="btn btn-ghost hidden" id="btnLogout">로그아웃</button>
                <button type="button" class="btn btn-primary" id="btnNewDiary">
                    <span aria-hidden="true">+</span> 새 일기
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="toolbar">
            <div class="date-range">
                <label>
                    <span class="label-text">시작일</span>
                    <input type="date" id="startDate">
                </label>
                <span class="range-sep">~</span>
                <label>
                    <span class="label-text">종료일</span>
                    <input type="date" id="endDate">
                </label>
                <button type="button" class="btn btn-secondary" id="btnSearch">조회</button>
            </div>
            <p class="hint">로그인 후 내 일기만 조회·작성할 수 있습니다. 저장 시 선택한 지역의 날씨가 함께 기록됩니다.</p>
        </section>

        <section class="diary-list" id="diaryList" aria-live="polite"></section>

        <div class="empty-state hidden" id="emptyState">
            <div class="empty-icon" aria-hidden="true">📔</div>
            <h2>아직 일기가 없어요</h2>
            <p>첫 번째 날씨 일기를 작성해 보세요.</p>
            <button type="button" class="btn btn-primary" id="btnEmptyNew">일기 작성하기</button>
        </div>

        <div class="loading hidden" id="loading">
            <div class="spinner"></div>
            <span>불러오는 중…</span>
        </div>
    </main>

    <dialog class="modal" id="diaryModal">
        <form method="dialog" class="modal-content" id="diaryForm">
            <div class="modal-header">
                <h2 id="modalTitle">새 일기</h2>
                <button type="button" class="btn-icon" id="btnCloseModal" aria-label="닫기">&times;</button>
            </div>

            <div class="modal-body">
                <div class="field">
                    <span class="label-text">날짜</span>
                    <div class="calendar" id="diaryCalendar">
                        <div class="calendar-header">
                            <button type="button" class="btn-icon calendar-nav" id="btnCalPrev" aria-label="이전 달">&lsaquo;</button>
                            <span class="calendar-title" id="calTitle"></span>
                            <button type="button" class="btn-icon calendar-nav" id="btnCalNext" aria-label="다음 달">&rsaquo;</button>
                        </div>
                        <div class="calendar-weekdays" aria-hidden="true">
                            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                        </div>
                        <div class="calendar-grid" id="calendarGrid"></div>
                        <p class="calendar-legend">
                            <span class="legend-dot"></span>
                            일기가 있는 날
                        </p>
                    </div>
                    <input type="hidden" id="diaryDate" required>
                </div>
                <div class="field">
                    <span class="label-text">지역</span>
                    <div class="area-search-box">
                        <div class="area-search-row">
                            <input type="text" id="diaryAreaSearch" placeholder="지역 이름 입력 (예: Seoul)" autocomplete="off">
                            <button type="button" class="btn btn-secondary" id="btnDiaryAreaSearch">검색</button>
                        </div>
                        <ul class="area-search-results hidden" id="diaryAreaResults"></ul>
                    </div>
                    <div class="diary-area-selected hidden" id="diaryAreaSelected"></div>
                </div>
                <label class="field">
                    <span class="label-text">일기</span>
                    <textarea id="diaryText" rows="6" placeholder="오늘 하루는 어땠나요?" required></textarea>
                </label>
                <p class="form-note" id="formNote">지역을 선택하면 해당 지역의 날씨가 함께 저장됩니다.</p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-danger hidden" id="btnDelete">삭제</button>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="btnCancel">취소</button>
                    <button type="submit" class="btn btn-primary" id="btnSave">저장</button>
                </div>
            </div>
        </form>
    </dialog>

    <dialog class="modal" id="profileModal">
        <form method="dialog" class="modal-content" id="profileForm">
            <div class="modal-header">
                <h2>내 정보</h2>
                <button type="button" class="btn-icon" id="btnCloseProfile" aria-label="닫기">&times;</button>
            </div>

            <div class="modal-body">
                <div class="profile-summary">
                    <div class="profile-row">
                        <span class="label-text">아이디</span>
                        <strong id="profileUsername">-</strong>
                    </div>
                    <div class="profile-row">
                        <span class="label-text">권한</span>
                        <strong id="profileRoles">-</strong>
                    </div>
                </div>

                <div class="field">
                    <span class="label-text">기본 지역</span>
                    <div class="area-search-box">
                        <div class="area-search-row">
                            <input type="text" id="profileAreaSearch" placeholder="지역 이름 입력 (예: Seoul)" autocomplete="off">
                            <button type="button" class="btn btn-secondary" id="btnProfileAreaSearch">검색</button>
                        </div>
                        <ul class="area-search-results hidden" id="profileAreaResults"></ul>
                    </div>
                    <div class="diary-area-selected hidden" id="profileAreaSelected"></div>
                    <p class="form-note">기본 지역은 일기 작성 시 자동으로 사용됩니다.</p>
                </div>
            </div>

            <div class="modal-footer">
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="btnCancelProfile">취소</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveProfile">저장</button>
                </div>
            </div>
        </form>
    </dialog>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
